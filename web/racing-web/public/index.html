<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Autonomous Racing - Live Spectator</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/microsoft-signalr/8.0.7/signalr.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background: #0f1117; color: #f0f2f5; overflow: hidden; }
    #header {
      position: absolute; top: 16px; left: 16px; z-index: 10;
      background: rgba(18, 22, 34, 0.85); backdrop-filter: blur(8px);
      padding: 12px 20px; border-radius: 8px; border: 1px solid #2d3748;
      display: flex; gap: 20px; align-items: center;
    }
    #header h1 { font-size: 1.1rem; color: #60a5fa; font-weight: 700; letter-spacing: 0.5px; }
    .badge { background: #1e293b; padding: 4px 10px; border-radius: 4px; font-size: 0.85rem; border: 1px solid #334155; }
    .live-dot { display: inline-block; width: 8px; height: 8px; background: #ef4444; border-radius: 50%; margin-right: 6px; animation: pulse 1.5s infinite; }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }
    #leaderboard {
      position: absolute; top: 16px; right: 16px; z-index: 10; width: 280px;
      background: rgba(18, 22, 34, 0.85); backdrop-filter: blur(8px);
      border-radius: 8px; border: 1px solid #2d3748; padding: 14px;
    }
    #leaderboard h3 { font-size: 0.95rem; margin-bottom: 10px; color: #cbd5e1; text-transform: uppercase; letter-spacing: 0.5px; }
    .lb-row { display: flex; justify-content: space-between; padding: 6px 0; border-bottom: 1px solid #1e293b; font-size: 0.85rem; }
    .lb-rank { font-weight: bold; width: 24px; color: #94a3b8; }
    .lb-name { flex: 1; font-weight: 500; }
    .lb-speed { color: #38bdf8; font-family: monospace; }
    canvas { display: block; width: 100vw; height: 100vh; }
  </style>
</head>
<body>
  <div id="header">
    <h1><span class="live-dot"></span>AUTONOMOUS RACING</h1>
    <div class="badge" id="race-id">Race: Waiting...</div>
    <div class="badge" id="tick-info">Tick: 0</div>
  </div>

  <div id="leaderboard">
    <h3>Leaderboard</h3>
    <div id="lb-entries">
      <div style="color: #64748b; font-size: 0.85rem;">Waiting for drivers...</div>
    </div>
  </div>

  <canvas id="viewport"></canvas>

  <script>
    const canvas = document.getElementById('viewport');
    const ctx = canvas.getContext('2d');

    let width = window.innerWidth;
    let height = window.innerHeight;
    canvas.width = width;
    canvas.height = height;

    window.addEventListener('resize', () => {
      width = window.innerWidth;
      height = window.innerHeight;
      canvas.width = width;
      canvas.height = height;
    });

    // Default circuit geometry fallback
    const trackPoints = [
      { x: 0, y: 0, width: 14 },
      { x: 60, y: 0, width: 14 },
      { x: 120, y: 20, width: 12 },
      { x: 140, y: 70, width: 12 },
      { x: 100, y: 120, width: 13 },
      { x: 30, y: 110, width: 14 },
      { x: -30, y: 60, width: 13 }
    ];

    let currentCars = [];
    let camera = { x: 50, y: 50, zoom: 4.5 };

    function drawTrack() {
      if (trackPoints.length < 3) return;

      ctx.save();
      // Camera Transform (World to Screen)
      ctx.translate(width / 2, height / 2);
      ctx.scale(camera.zoom, -camera.zoom); // Y-up
      ctx.translate(-camera.x, -camera.y);

      // Track Road Surface
      ctx.beginPath();
      ctx.moveTo(trackPoints[0].x, trackPoints[0].y);
      for (let i = 1; i < trackPoints.length; i++) {
        ctx.lineTo(trackPoints[i].x, trackPoints[i].y);
      }
      ctx.closePath();
      ctx.strokeStyle = '#262d3d';
      ctx.lineWidth = 14;
      ctx.lineCap = 'round';
      ctx.lineJoin = 'round';
      ctx.stroke();

      // Track Road Center Dotted Line
      ctx.beginPath();
      ctx.moveTo(trackPoints[0].x, trackPoints[0].y);
      for (let i = 1; i < trackPoints.length; i++) {
        ctx.lineTo(trackPoints[i].x, trackPoints[i].y);
      }
      ctx.closePath();
      ctx.strokeStyle = '#475569';
      ctx.lineWidth = 0.5;
      ctx.setLineDash([2, 2]);
      ctx.stroke();
      ctx.setLineDash([]);

      // Draw Cars
      currentCars.forEach((car, index) => {
        ctx.save();
        ctx.translate(car.x, car.y);
        ctx.rotate(car.rotation);

        // Car body
        const colors = ['#38bdf8', '#f43f5e', '#10b981', '#fbbf24', '#a855f7'];
        ctx.fillStyle = colors[index % colors.length];
        ctx.fillRect(-2, -1, 4, 2);

        // Headlights
        ctx.fillStyle = '#fef08a';
        ctx.fillRect(1.8, -0.9, 0.4, 0.6);
        ctx.fillRect(1.8, 0.3, 0.4, 0.6);

        ctx.restore();

        // Car Name Tag
        ctx.save();
        ctx.translate(car.x, car.y);
        ctx.scale(1 / camera.zoom, -1 / camera.zoom);
        ctx.fillStyle = '#ffffff';
        ctx.font = '10px monospace';
        ctx.textAlign = 'center';
        ctx.fillText(car.name, 0, -14);
        ctx.restore();
      });

      ctx.restore();
    }

    function renderLoop() {
      ctx.fillStyle = '#0f1117';
      ctx.fillRect(0, 0, width, height);

      drawTrack();
      requestAnimationFrame(renderLoop);
    }
    requestAnimationFrame(renderLoop);

    // SignalR Connection
    const connection = new signalR.HubConnectionBuilder()
      .withUrl("http://localhost:5000/hubs/race")
      .withAutomaticReconnect()
      .build();

    connection.on("ReceiveSnapshot", (snapshot) => {
      document.getElementById('tick-info').innerText = `Tick: ${snapshot.tick}`;
      document.getElementById('race-id').innerText = `Race: ${snapshot.raceId.substring(0, 8)}...`;

      currentCars = snapshot.cars;

      // Update Leaderboard
      const sorted = [...snapshot.cars].sort((a, b) => (b.lap * 10000 + b.distanceAlongTrack) - (a.lap * 10000 + a.distanceAlongTrack));
      const lb = document.getElementById('lb-entries');
      lb.innerHTML = sorted.map((c, i) => `
        <div class="lb-row">
          <span class="lb-rank">#${i + 1}</span>
          <span class="lb-name">${c.name}</span>
          <span class="lb-speed">${(c.speed * 3.6).toFixed(1)} km/h</span>
        </div>
      `).join('');
    });

    connection.start()
      .then(() => {
        console.log("Connected to SignalR Spectator Hub");
        connection.invoke("JoinRace", "all");
      })
      .catch(err => console.log("SignalR Connection waiting for server...", err));
  </script>
</body>
</html>
