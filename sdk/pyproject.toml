[build-system]
requires = ["uv_build"]
build-backend = "uv_build"

[project]
name = "racing-sdk"
version = "0.1.0"
description = "Python AI SDK for the Autonomous Racing Platform"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "grpcio>=1.60.0",
    "protobuf>=4.25.0",
]

[dependency-groups]
dev = [
    "pytest>=7.0",
    "grpcio-tools>=1.60.0",
]
